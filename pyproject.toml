[project]
name = "local-models"
version = "0.1.0"
description = "Local decision models and LLMs on Apple Silicon, with MCP servers and one Mac app"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mlx-vlm==0.7.10",
    "torch>=2.15",
    "transformers>=5.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fastmcp>=4.1",
    "httpx>=0.28",
    "torchvision>=0.29",   # Qwen3.5 image processor (pplx-decider)
    "einops>=0.8",         # Kanana image processor
]

[project.scripts]
decisionctl = "local_models.decision.ctl:Ctl.main"
decision-mcp = "local_models.decision.mcp_server:main"
llmctl = "local_models.llm.ctl:Ctl.main"
llm-mcp = "local_models.llm.mcp_server:main"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs running models (decisionctl start / llmctl start)"]
